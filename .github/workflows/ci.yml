
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: ci-checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharemaxxing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sharemaxxing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sharemaxxing_test?schema=public
      JWT_SECRET: ci-test-secret-only-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Backend
      - name: Install backend dependencies
        working-directory: sharemaxxing/backend
        run: npm ci

      - name: Validate Prisma
        working-directory: sharemaxxing/backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: sharemaxxing/backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: sharemaxxing/backend
        run: npx prisma migrate deploy

      - name: Backend tests
        working-directory: sharemaxxing/backend
        run: npm test

      - name: Backend build
        working-directory: sharemaxxing/backend
        run: npm run build

      # Frontend
      # Commented out until frontend is implemented
