# Render Blueprint for the live site (WBS-29.1, WBS-29.2). See docs/CloudSetup.md.
# The database is on Neon, so it is not listed here.

services:
  # Express API
  - type: web
    name: sharemaxxing-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # "npm run build" also applies pending Prisma migrations to DATABASE_URL.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Deploy every commit on main, but only after the CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon connection string. Entered once in the Render Dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://sharemaxxing-web.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"

  # React frontend, served as static files
  - type: web
    name: sharemaxxing-web
    runtime: static
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://sharemaxxing-api.onrender.com/api
    routes:
      # Page routes are handled by React Router.
      - type: rewrite
        source: /*
        destination: /index.html
